# Dependency updates.
#
# Every Go module is listed separately: Dependabot does not discover modules in
# subdirectories on its own, so a missing entry is a module that silently never
# gets an update. There are four.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: gomod
    directory: /provider/anthropic
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: gomod
    directory: /gateway
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: gomod
    directory: /otel
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope

  # Actions are pinned by SHA, which is what makes them safe and also what
  # makes them invisible to a human reading the diff. Dependabot rewrites both
  # the digest and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
