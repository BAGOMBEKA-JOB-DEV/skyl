name: CI

on:
  push:
    branches: [main]
    # Release tags are built too, so the publishability gate below actually
    # runs against the commit being published rather than against main.
    tags:
      - "v*"
      - "provider/anthropic/v*"
      - "gateway/v*"
      - "otel/v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"

  # Every job builds each module on its own, never through the workspace. With
  # go.work active a module resolves its siblings from the local directory, so
  # a `require` line naming a version that does not exist still builds — and
  # that is precisely the failure that only shows up once somebody outside this
  # repository runs `go get`. See RELEASING.md.
  GOWORK: "off"

jobs:
  build:
    name: ${{ matrix.module }} (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per module. The split is the point of the layout: the core
        # library must keep building without the gateway's or Anthropic SDK's
        # dependencies. See docs/adr/0001-two-module-layout.md.
        #
        # Each module is built twice: once on the oldest Go it claims to
        # support, once on the newest. A floor that is only ever built with the
        # current toolchain is a guess — the older job is what turns the `go`
        # directive from a claim into a tested one. The two adapter modules
        # cannot go below 1.24 because anthropic-sdk-go declares it, and since
        # Go 1.21 that is a hard requirement rather than advice. otel/ is at
        # 1.25 for the same reason, imposed by the OpenTelemetry SDK — and the
        # gateway inherits that floor because it depends on otel/ for its
        # metrics. A server can absorb a newer floor; the library cannot, which
        # is why the root module stays at 1.22.
        #
        # Coverage floors sit just under the current figure, so a regression
        # fails the build while ordinary refactoring does not. Raise them when
        # coverage rises; never lower one to make a red build go green.
        # Coverage is measured on the current toolchain only.
        include:
          - module: "."
            go: "1.22"
            coverage: false
          - module: "."
            go: "1.26"
            coverage: true
            min_coverage: "87"
          - module: "provider/anthropic"
            go: "1.24"
            coverage: false
          - module: "provider/anthropic"
            go: "1.26"
            coverage: true
            min_coverage: "93"
          - module: "gateway"
            go: "1.25"
            coverage: false
          - module: "gateway"
            go: "1.26"
            coverage: true
            min_coverage: "86"
          - module: "otel"
            go: "1.25"
            coverage: false
          - module: "otel"
            go: "1.26"
            coverage: true
            min_coverage: "85"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          # The root module has no dependencies and therefore no go.sum, so
          # naming one would warn on every run. Cache on the file that exists.
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            ${{ matrix.module }}/go.mod

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      # Tagged tests are excluded from the default build, so nothing else here
      # would notice them failing to compile. The integration suite in
      # particular can only be *run* with real credentials, which makes
      # compiling it the only check CI can perform.
      - name: go vet (including tagged tests)
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go vet -tags=integration ./...
          go vet -tags=sandbox ./...

      # -tags=sandbox adds the end-to-end suite: the same checks the live suite
      # runs against real providers, driven against a local server that speaks
      # each provider's wire protocol. It needs no credential and costs
      # nothing, so unlike -tags=integration it can run on every pull request —
      # and it is the only thing here that exercises real sockets, real SSE
      # framing, and the retry path against real status codes.
      #
      # -coverpkg=./... attributes coverage across package boundaries. Without
      # it Go credits a statement only to the package whose own tests ran, so
      # code exercised from a sibling package's test reads as 0% — internal/oai
      # is driven almost entirely by provider/*, and internal/httpx by every
      # adapter. The module-wide profile is the honest measure.
      #
      # -count=1 disables the test cache. A cached run replays a truncated
      # merged coverage profile, which under-reports the module-wide total by
      # more than twenty points and would fail the floor below for no reason.
      - name: go test (race)
        working-directory: ${{ matrix.module }}
        run: |
          go test -count=1 -race -tags=sandbox -coverpkg=./... \
            -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage floor
        if: matrix.coverage
        working-directory: ${{ matrix.module }}
        run: |
          # Test-support packages are scaffolding, not shipped behaviour. Their
          # uncovered halves are the failure-reporting paths that only execute
          # when a test fails, the live-API harness that CI never runs, and the
          # cassette recorder's record half, which needs a real credential — so
          # measuring them reports on the test run, not on the library.
          grep -v -E '/internal/(testutil|providertest|cassette)/' coverage.out > covered.out

          total=$(go tool cover -func=covered.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "coverage: ${total}% (floor ${{ matrix.min_coverage }}%)"
          go tool cover -func=covered.out | grep -v '^total:' | awk '$NF != "100.0%"' || true

          awk -v got="$total" -v min="${{ matrix.min_coverage }}" 'BEGIN {
            if (got + 0 < min + 0) {
              printf "::error::coverage %.1f%% is below the %s%% floor\n", got, min
              exit 1
            }
          }'

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: verify tidy
        run: |
          for mod in . provider/anthropic gateway otel; do
            echo "==> $mod"
            (cd "$mod" && go mod tidy)
          done
          if ! git diff --exit-code -- '**/go.mod' '**/go.sum' go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' in each module"
            exit 1
          fi

  # A module published with a `replace` directive is permanently broken, and
  # nothing about it looks broken from inside this repository: `replace` is
  # honoured only in the main module, so it keeps working here and is ignored
  # for everyone else, leaving them with whatever the `require` line says. Tags
  # on the module proxy are immutable, so this cannot be fixed after the fact —
  # only fixed forward with a new version. Hence a hard gate rather than a note
  # in RELEASING.md.
  #
  # It runs on tags only. Before the first release the replaces are how the
  # repository builds at all, since there is no published version for the
  # require lines to name yet; scripts/release.sh is what removes them, and
  # this job is what proves it did.
  releasable:
    name: modules are publishable
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Check only the module THIS tag publishes.
      #
      # Checking all three on every tag would fail the root tag, and fail it
      # legitimately: RELEASING.md requires the root to go first, and
      # scripts/release.sh only rewrites the submodules afterwards — a
      # submodule's go.sum cannot be computed until the version it depends on
      # is resolvable on the proxy. So at root-tag time the submodules still
      # carry their replace and their v0.0.0 require, exactly as intended.
      #
      # A gate that fails on the one tag where nothing is wrong teaches people
      # to ignore it.
      - name: identify the module under release
        id: mod
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          case "$ref" in
            provider/anthropic/v*) dir=provider/anthropic ;;
            gateway/v*)            dir=gateway ;;
            otel/v*)               dir=otel ;;
            v*)                    dir=. ;;
            *)
              echo "::error::$ref is not a recognised release tag"
              exit 1
              ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "tag $ref publishes $dir"

      - name: no replace directives
        run: |
          dir='${{ steps.mod.outputs.dir }}'
          if [ "$dir" = "." ]; then
            echo "the root module has no intra-repo dependencies — nothing to check"
            exit 0
          fi
          if grep -qE '^\s*replace\s' "$dir/go.mod"; then
            echo "::error file=$dir/go.mod::$dir/go.mod contains a replace directive"
            grep -nE '^\s*replace\s' "$dir/go.mod"
            echo "A replace is ignored by consumers, so publishing one means the require"
            echo "line is the only thing that resolves. Use go.work locally; see RELEASING.md."
            exit 1
          fi
          echo "no replace directives — $dir is publishable"

      # A require on a version that was never tagged fails the same way, and is
      # what actually breaks the install: the replace above merely hides it.
      - name: no placeholder versions
        run: |
          dir='${{ steps.mod.outputs.dir }}'
          if [ "$dir" = "." ]; then
            echo "the root module requires nothing from this repository"
            exit 0
          fi
          if grep -nE 'BAGOMBEKA-JOB-DEV/skyl[^ ]* v0\.0\.0' "$dir/go.mod"; then
            echo "::error file=$dir/go.mod::$dir requires a repository module at v0.0.0, which will never exist on the proxy"
            exit 1
          fi
          echo "no placeholder versions — $dir is publishable"

  # govulncheck reports vulnerabilities that are actually *reachable* from this
  # code, not merely present in the dependency graph, which is what makes it
  # worth failing a build over. It also covers the standard library, so a
  # toolchain shipping without its security patches shows up here.
  vuln:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "provider/anthropic", "gateway", "otel"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        # Pinned rather than @latest: this tool decides whether the build fails,
        # so an upstream release changing its behaviour should be a deliberate
        # bump here, not a surprise on an unrelated pull request. The
        # vulnerability *database* is still fetched live, which is the part that
        # genuinely needs to be current.
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "provider/anthropic", "gateway", "otel"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # The action major must match the golangci-lint major: v7 was the first
      # release to support golangci-lint v2, and this repository's
      # .golangci.yml is `version: "2"`. Pairing action v6 with lint v2.12.2
      # fails in seconds with a config it cannot parse — which is exactly what
      # it did, on every module, until this was corrected.
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  # The container image is code: it encodes the module layout, the build flags
  # and the CA-bundle requirement. Building it in CI is what stops it drifting
  # from a repository that has already changed shape three times.
  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: build gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: skyl-gateway:ci

      - name: build sandbox image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: false
          tags: skyl-sandbox:ci

  # A single check for branch protection to require.
  #
  # The matrices above produce fourteen differently-named checks, and naming
  # each one in the repository settings means the list silently goes stale
  # every time a module or a Go version is added. This job depends on all of
  # them, so requiring it requires everything.
  ci-ok:
    name: CI
    if: always()
    needs: [build, tidy, lint, vuln, image]
    runs-on: ubuntu-latest
    steps:
      - name: check results
        run: |
          # A skipped job is fine; a failed or cancelled one is not.
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required job reported $r"
              exit 1
            fi
          done
          echo "all required jobs passed"
