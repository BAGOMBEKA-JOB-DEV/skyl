name: DCO

# Every commit must carry a Signed-off-by line.
#
# CONTRIBUTING.md states that contributions are licensed under Apache-2.0. Until
# now that was an assertion in a markdown file that nobody was ever asked to
# agree to. The Developer Certificate of Origin turns it into something each
# contributor affirms per commit, which is what a legal review looks for — and
# it is far lighter than a CLA, requiring no signature and no paperwork.
#
#   git commit -s
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: verify Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # Merge commits are excluded: they are created by GitHub, not by a
          # contributor, so there is nobody to attest anything.
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::$sha has no Signed-off-by line"
              git log -1 --format='  %h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Add one with: git commit -s   (or: git rebase --signoff $BASE)"
            exit 1
          fi
          echo "every commit is signed off"
