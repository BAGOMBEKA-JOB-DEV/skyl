name: Publish image

# Publishes the gateway container image to GHCR, signed and attested.
#
# CI already builds this image on every push (ci.yml, the `image` job) so it
# cannot drift. That build deliberately does not push: a commit on main is not
# a release. This workflow is the other half — it runs only for a gateway tag
# and produces something a cluster can actually pull.
#
# Consumers must pin the digest, not the tag. The digest is printed in the job
# summary and is what skyl_infrastructure references; a mutable tag would make
# a deployment unreproducible and defeat the signature below.
on:
  push:
    tags:
      # Only the gateway module is a deployable artefact. A root or provider
      # tag releases a Go module and has no image to build.
      - "gateway/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "gateway tag to build, e.g. gateway/v0.1.0"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/skyl-gateway

jobs:
  publish:
    name: build, sign and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing and provenance, no stored keys
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # arm64 matters more than it looks: Graviton and Ampere node pools are
      # the cheap tier on all three clouds skyl_infrastructure targets, and an
      # amd64-only image silently excludes them.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is `gateway/v0.1.0`; a Docker tag cannot contain a slash. The
      # `match` pattern strips the module prefix so the image is tagged
      # `0.1.0`, `0.1`, `0` — not `gateway/v0.1.0`, which would be rejected.
      - name: derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=gateway/v(.*),group=1
            type=match,pattern=gateway/v(\d+\.\d+),group=1
            type=match,pattern=gateway/v(\d+),group=1
          labels: |
            org.opencontainers.image.title=skyl-gateway
            org.opencontainers.image.description=One authenticated endpoint fanning out to every model provider
            org.opencontainers.image.licenses=Apache-2.0

      # Context is the repository root, not gateway/ — the gateway module
      # resolves its siblings through `replace => ..` and cannot see them from
      # a narrower context. The Dockerfile's own header explains this at
      # length; it is the single most common way this build is broken.
      - name: build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance:false keeps the index to two real manifests. Buildkit's
          # own attestation manifests otherwise confuse `cosign sign` about
          # which digest it is signing; GitHub's attestation below is the
          # stronger claim anyway.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity, so
      # there is no private key to store or rotate. Verify with
      #   cosign verify ghcr.io/<owner>/skyl-gateway@<digest> \
      #     --certificate-identity-regexp '^https://github.com/<owner>/skyl/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: sign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # An SBOM of the image, distinct from release.yml's SBOM of the source
      # tree. They answer different questions: that one is what the modules
      # depend on, this one is what actually shipped in the layer.
      - name: generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: skyl-gateway.spdx.json
          artifact-name: skyl-gateway.spdx.json

      - name: attach SBOM attestation
        run: cosign attest --yes --predicate skyl-gateway.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The digest is the deliverable. Printing it here saves a `crane digest`
      # round trip when bumping the pin in skyl_infrastructure.
      - name: summary
        run: |
          {
            echo "## skyl-gateway published"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Pin this digest in skyl_infrastructure — never the tag."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
