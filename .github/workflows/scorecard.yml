name: Scorecard

# OpenSSF Scorecard measures the supply-chain practices an enterprise review
# asks about — pinned actions, branch protection, signed releases, and so on.
#
# It is scheduled rather than per-PR because most of what it measures is
# repository configuration rather than code, and that changes rarely.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 5 * * 3" # Wednesdays, 05:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result
      id-token: write # publish the result so the badge can read it
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: run analysis
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the README badge work, and it is what
          # lets somebody evaluating skyl check the score without cloning it.
          publish_results: true

      - name: upload to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: results.sarif
