# Linter configuration for every skyl module.
#
# The selection is deliberately small: linters that catch real defects, not
# ones that generate churn. A lint rule nobody believes in gets suppressed
# everywhere and stops meaning anything.

version: "2"

# Build tags the linter compiles with. Without these the tagged suites are
# invisible to it — and a file nobody lints is a file where the rules quietly
# stop applying.
#
# This belongs under `run`. A top-level `build-tags` key is accepted without
# complaint and does nothing, which looks identical to working.
run:
  build-tags:
    - integration
    - sandbox

linters:
  enable:
    - errcheck      # unchecked errors — rules.md §2.4
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose     # leaked HTTP response bodies
    - errorlint     # %w wrapping and errors.Is/As misuse — rules.md §2.1
    - misspell
    - nilerr        # returning nil when err is non-nil
    - unconvert
    - usestdlibvars

  settings:
    errcheck:
      check-type-assertions: true
    staticcheck:
      checks:
        - all

  exclusions:
    rules:
      # Tests legitimately ignore errors on cleanup paths and use unchecked
      # type assertions to keep table-driven cases readable.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
